version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: diyacreation-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: diya_admin
      POSTGRES_PASSWORD: diyacreation_secret_pass_2026
      POSTGRES_DB: diyacreation
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  redis:
    image: redis:7-alpine
    container_name: diyacreation-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: always

volumes:
  postgres_data:
  redis_data:
